name: Build Smiley
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip SmileyApp.zip
      - run: cd SmileyApp && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Smiley-APK
          path: SmileyApp/app/build/outputs/apk/debug/app-debug.apk
